# One toolchain build of the Dockerfile and its test program artifact
# cetest-<name>; called by gcc16.yml.
name: gcc16 build

on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
      targets:
        description: TARGETS build arg, one or more targets
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    name: ${{ inputs.name }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      # The source trees are submodules, fetched shallow (depth 1).
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v4

      # Cached per stage and target, so a test program change does not
      # rebuild the toolchain.
      - name: Build the toolchain and the test program
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: programs
          build-args: |
            TARGETS=${{ inputs.targets }}
          outputs: type=local,dest=out
          cache-from: type=gha,scope=gcc16-${{ inputs.name }}
          cache-to: type=gha,mode=max,scope=gcc16-${{ inputs.name }}

      - name: Test programs
        run: ls -l out && cat out/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: cetest-${{ inputs.name }}
          path: out/
          if-no-files-found: error
