# CeGCC 16.2 image: both targets (arm-mingw32ce and
# sh4-mingw32ce) in /opt/cegcc, from the trees pinned in the Dockerfile.
# Runs the tests and builds the test programs for both targets (artifact
# cegcc16-test-programs, with SHA256SUMS), then builds the image.
#
#   tag v16.*            :<tag> and :latest, and the release page
#                        (release-page.yml)
#   push to releases/gcc-16  :edge
#   pull request, manual builds and tests only, nothing is pushed
# on ghcr.io/palian-tech/cegcc and docker.io/paliantech/cegcc. :latest and
# :edge follow the newest line; the 9.3 line has :gcc9 and :gcc9-edge
# (image.yml on releases/gcc-9).
name: gcc16 release

on:
  push:
    branches: [releases/gcc-16]
    tags: ['v16.*']
  pull_request:
    branches: [releases/gcc-16]
    paths:
      - '.github/workflows/gcc16-release.yml'
  workflow_dispatch:

# A newer push to releases/gcc-16 cancels the older run, so an older run cannot
# finish last and overwrite :edge; tag runs are never cancelled.
concurrency:
  group: gcc16-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/releases/gcc-16' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/palian-tech/cegcc
  DOCKERHUB_IMAGE: docker.io/paliantech/cegcc
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the toolchains, run the tests, build the test programs
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: programs
          outputs: type=local,dest=out
          cache-from: type=gha,scope=gcc16-release
          cache-to: type=gha,mode=max,scope=gcc16-release

      - name: Test programs
        run: ls -l out && cat out/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: cegcc16-test-programs
          path: out/
          if-no-files-found: error

      # The description of the line, not the repository's description.
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v16.') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/releases/gcc-16' }}
          labels: |
            org.opencontainers.image.title=CeGCC 16.2
            org.opencontainers.image.description=CeGCC 16.2: GCC 16.2.0 cross toolchains for Windows CE, arm-mingw32ce and sh4-mingw32ce
          annotations: |
            org.opencontainers.image.title=CeGCC 16.2
            org.opencontainers.image.description=CeGCC 16.2: GCC 16.2.0 cross toolchains for Windows CE, arm-mingw32ce and sh4-mingw32ce

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=gcc16-release

  # The release page of a v16.* tag, with the test programs of this run.
  release-page:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v16.')
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-page.yml
    with:
      tag: ${{ github.ref_name }}
      programs_run: ${{ github.run_id }}
