# CeGCC 16.2 image (docs/gcc16): both targets (arm-mingw32ce and
# sh4-mingw32ce) in /opt/cegcc, from the trees pinned in gcc16/Dockerfile.
# Runs the tests and builds the test programs for both targets (artifact
# cegcc16-test-programs, with SHA256SUMS), then builds the image.
#
#   tag v16.*            pushes ghcr.io/palian-tech/cegcc:<tag> and
#                        docker.io/paliantech/cegcc:<tag>
#   pull request, manual builds and tests only, nothing is pushed
#
# :latest and :edge stay with the 9.3 image (image.yml on sh4-mingw32ce).
name: gcc16 release

on:
  push:
    tags: ['v16.*']
  pull_request:
    branches: [master, gcc16]
    paths:
      - '.github/workflows/gcc16-release.yml'
  workflow_dispatch:

concurrency:
  group: gcc16-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/palian-tech/cegcc
  DOCKERHUB_IMAGE: docker.io/paliantech/cegcc
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v16.') }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the toolchains, run the tests, build the test programs
        uses: docker/build-push-action@v7
        with:
          context: .
          file: gcc16/Dockerfile
          target: programs
          outputs: type=local,dest=out
          cache-from: type=gha,scope=gcc16-release
          cache-to: type=gha,mode=max,scope=gcc16-release

      - name: Test programs
        run: ls -l out && cat out/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: cegcc16-test-programs
          path: out/
          if-no-files-found: error

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: gcc16/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gcc16-release
