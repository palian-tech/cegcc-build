# Builds the CeGCC image (arm-mingw32ce and sh4-mingw32ce in /opt/cegcc),
# runs the sh4 binutils and ABI tests, builds the test programs of
# tests/sh4/prog for both targets and publishes:
#   push to releases/gcc-9  ghcr.io/palian-tech/cegcc:edge
#   tag v*                  ghcr.io/palian-tech/cegcc:<tag> and :latest
# Every tag is also pushed to docker.io/paliantech/cegcc.
# The test programs are uploaded as the workflow artifact
# cegcc-test-programs (with SHA256SUMS).
name: image

on:
  push:
    branches: [releases/gcc-9]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push cancels the older run of the same ref, so an older run
# cannot finish last and overwrite :edge.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/palian-tech/cegcc
  DOCKERHUB_IMAGE: docker.io/paliantech/cegcc

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v3

      # Layers are cached per stage (mode=max), so a GCC-only change does
      # not rebuild binutils.
      - name: Build the toolchain, run the tests, build the test programs
        uses: docker/build-push-action@v6
        with:
          context: .
          target: programs
          outputs: type=local,dest=out
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test programs
        run: ls -l out && cat out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: cegcc-test-programs
          path: out/
          if-no-files-found: error

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/releases/gcc-9' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && steps.meta.outputs.tags != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
