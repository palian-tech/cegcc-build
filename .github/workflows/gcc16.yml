# CeGCC on newer GCC (docs/gcc16): builds the toolchains of gcc16/Dockerfile
# and the test program tests/gcc16/cetest.cpp, and uploads the test
# program EXEs as the workflow artifact cetest-<job name> (with
# SHA256SUMS). Nothing is published to a registry.
#
# Jobs:
#   gate1-arm-gcc14  salman-javed-nz's GCC 14.2 trees (Dockerfile defaults)
#   arm-gcc16        our ce-16.2.0 / ce-2.43.1 / ce-16 branches, pinned
#   sh4-gcc16        the same trees for SH-4; the test stage also runs the
#                    ABI gate (tests/gcc16/sh4-abi-gate.sh) under qemu-sh4
name: gcc16

on:
  push:
    branches: [gcc16, 'claude/**']
    paths:
      - 'gcc16/**'
      - 'tests/gcc16/**'
      - 'tests/sh4/**'
      - 'docs/sh4/**'
      - 'build_cf.sh'
      - '.github/workflows/gcc16.yml'
  pull_request:
    branches: [gcc16]
  workflow_dispatch:

# No cancelling: runs take hours and nothing is published, so an older
# run's artifacts stay useful.
concurrency:
  group: gcc16-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gate1-arm-gcc14
            target: arm-mingw32ce
            trees: ""
          - name: arm-gcc16
            target: arm-mingw32ce
            trees: |
              GCC_REPO=https://github.com/palian-tech/gcc
              GCC_COMMIT=43596e5d45735e3b73f464b294792d0203ed8dc2
              BINUTILS_REPO=https://github.com/palian-tech/binutils-gdb
              BINUTILS_COMMIT=a817d8b8ee3ed044735ac19bff0fe5292ce38124
              MINGW_REPO=https://github.com/palian-tech/mingwrt
              MINGW_COMMIT=72d79b48e5b3bdd759c34e0f1d4980846063f82c
              W32API_REPO=https://github.com/palian-tech/w32api
              W32API_COMMIT=9a0d7c127dac922cb42b770573ce1260a40e8f0e
          - name: sh4-gcc16
            target: sh4-mingw32ce
            trees: |
              GCC_REPO=https://github.com/palian-tech/gcc
              GCC_COMMIT=43596e5d45735e3b73f464b294792d0203ed8dc2
              BINUTILS_REPO=https://github.com/palian-tech/binutils-gdb
              BINUTILS_COMMIT=a9e430957907734c3fb5329b3f93dcc68439a5f7
              MINGW_REPO=https://github.com/palian-tech/mingwrt
              MINGW_COMMIT=4d2707bb3ff9f1e2a5c37b1e505092ccccc38ac4
              W32API_REPO=https://github.com/palian-tech/w32api
              W32API_COMMIT=9a0d7c127dac922cb42b770573ce1260a40e8f0e
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Cached per stage and target, so a test program change does not
      # rebuild the toolchain.
      - name: Build the toolchain and the test program
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gcc16/Dockerfile
          target: programs
          build-args: |
            TARGET=${{ matrix.target }}
            ${{ matrix.trees }}
          outputs: type=local,dest=out
          cache-from: type=gha,scope=gcc16-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=gcc16-${{ matrix.name }}

      - name: Test programs
        run: ls -l out && cat out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: cetest-${{ matrix.name }}
          path: out/
          if-no-files-found: error
